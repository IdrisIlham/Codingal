<!DOCTYPE html>
<html>
     <head>
        <title>My Hobby Cards</title>
        <!--Step 1 - Bootstrap CSS link -->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

        <style>
            body {
                background-color: #f9f9f9;
                font-family: Arial, sans-serif;
                padding: 30px 15px;
            }

            h1 {
                text-align: center;
                color: #FF5A43;
            }

            .hobby-card{
                text-align: center;
                border: 2px solid #FF5A43;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
                background-color: #fff8e1;
            }

            .hobby-card h3 {
                color: #FF5A43;
            }
        </style>
     </head>

     <body>

        <h1>My Hobby Cards</h1>

        <!-- Step 2 - container keeps the layout neat and centered -->
        <div class="container">

                <!-- Step 3 - row holds all the columns in one horizontal line -->
                <div class="row">
                <div class="col-md-4">
                    <div class="hobby-card">
                        <h3>Photography</h3>
                        <p>I love capturing moments and creating memories through my lens.</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="hobby-card">
                        <h3>Cooking</h3>
                        <p>Experimenting with flavors and creating delicious dishes is my passion.</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="hobby-card">
                        <h3>Traveling</h3>
                        <p>Exploring new places and experiencing different cultures is exhilarating.</p>
                    </div>
                </div>
            </div>
     </body>
</html>
