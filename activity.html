<!DOCTYPE html>
<html>
    <head>
        <title>Form in html</title>
    </head>
    <body>
        <h1>Personal details form</h1>
        <label>Name</label>
        <input type="text" id="name"><br><br>

        <label>Email ID</label>
        <input type="number" id="email"><br><br>
       
        <label>Contact Number (This will be hidden) </label>
        <input type="number" id="contact"><br><br>

        <label>Gender</label><br>
        <input type="radio" id="female" name="gender" value="Female">Female<br>
        <input type="radio" id="male" name="gender" value="male">Male<br><br>
        
        <label>Favourite City</label><br>
        <input type="checkbox" id="city" value="Lagos">Lagos<br>
        <input type="checkbox" id="city" value="Mumbai">Mumbai<br>
        <input type="checkbox" id="city" value="Ikorodu">Ikorodu<br><br>

        <input type="Submit">

    </body>
</html>
